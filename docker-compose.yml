services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: valibra
      POSTGRES_PASSWORD: valibra
      POSTGRES_DB: valibra
    ports:
      - "5432:5432"
    volumes:
      - valibra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valibra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  valibra_pgdata:
